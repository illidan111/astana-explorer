<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astana Explorer</title>
  <script>
    (() => {
      let theme;

      try {
        theme = window.localStorage.getItem('astana-explorer-theme');
      } catch (error) {
        theme = null;
      }

      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }

      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root {
      color-scheme: light;
      --color-surface: #ffffff;
      --color-surface-translucent: rgba(255, 255, 255, 0.96);
      --color-input-surface: #ffffff;
      --color-text: #172033;
      --color-text-secondary: #475569;
      --color-text-muted: #64748b;
      --color-placeholder: #94a3b8;
      --color-border: #cbd5e1;
      --color-border-soft: #e2e8f0;
      --color-hover: #f1f5f9;
      --color-hover-accent: #eff6ff;
      --color-primary: #172033;
      --color-primary-hover: #26334a;
      --color-primary-text: #ffffff;
      --color-accent: #1d4ed8;
      --color-focus: #2563eb;
      --color-focus-shadow: rgba(37, 99, 235, 0.15);
      --color-focus-outline: #93c5fd;
      --color-open: #15803d;
      --color-closed: #dc2626;
      --color-favorite: #e11d48;
      --color-panel-border: rgba(226, 232, 240, 0.9);
      --shadow-panel: 0 4px 20px rgba(0, 0, 0, 0.16);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-surface: #1e293b;
      --color-surface-translucent: rgba(15, 23, 42, 0.96);
      --color-input-surface: #0f172a;
      --color-text: #f1f5f9;
      --color-text-secondary: #cbd5e1;
      --color-text-muted: #cbd5e1;
      --color-placeholder: #94a3b8;
      --color-border: #475569;
      --color-border-soft: #475569;
      --color-hover: #334155;
      --color-hover-accent: #1e3a5f;
      --color-primary: #e2e8f0;
      --color-primary-hover: #cbd5e1;
      --color-primary-text: #0f172a;
      --color-accent: #93c5fd;
      --color-focus: #60a5fa;
      --color-focus-shadow: rgba(96, 165, 250, 0.24);
      --color-focus-outline: #60a5fa;
      --color-open: #4ade80;
      --color-closed: #f87171;
      --color-favorite: #fb7185;
      --color-panel-border: rgba(71, 85, 105, 0.9);
      --shadow-panel: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e2e8f0;
    }

    :root[data-theme="dark"] #map {
      background: #0f172a;
    }

    .map-skeleton {
      position: absolute;
      inset: 0;
      z-index: 650;
      overflow: hidden;
      background: #e2e8f0;
      opacity: 1;
      pointer-events: none;
      transition: opacity 100ms ease, visibility 0s linear 100ms;
    }

    :root[data-theme="dark"] .map-skeleton {
      background: #0f172a;
    }

    .map-skeleton.is-hidden {
      visibility: hidden;
      opacity: 0;
    }

    .map-skeleton-rectangle {
      position: absolute;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.82);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
    }

    .map-skeleton-rectangle:nth-child(1) {
      top: 28%;
      left: 22%;
      width: 150px;
      height: 78px;
    }

    .map-skeleton-rectangle:nth-child(2) {
      top: 48%;
      right: 19%;
      width: 180px;
      height: 92px;
    }

    .map-skeleton-rectangle:nth-child(3) {
      bottom: 17%;
      left: 40%;
      width: 125px;
      height: 68px;
    }

    :root[data-theme="dark"] .map-skeleton-rectangle {
      background: rgba(71, 85, 105, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .leaflet-tile-pane .leaflet-layer,
    .leaflet-tile,
    .leaflet-marker-icon {
      transition: opacity 350ms ease;
    }

    .map-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      z-index: 1000;
      width: min(680px, calc(100vw - 40px));
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid var(--color-panel-border);
      border-radius: 16px;
      background: var(--color-surface-translucent);
      box-shadow: var(--shadow-panel);
      transform: translateX(-50%);
      transition: background-color 250ms ease, border-color 250ms ease, box-shadow 250ms ease;
    }

    .places-counter {
      margin: 0 0 8px;
      color: var(--color-text-muted);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      transition: color 250ms ease;
    }

    .weather-widget {
      position: absolute;
      top: 84px;
      left: 20px;
      z-index: 1001;
      display: flex;
      align-items: center;
      min-height: 40px;
      box-sizing: border-box;
      padding: 0 13px;
      border: 1px solid var(--color-panel-border);
      border-radius: 12px;
      background: var(--color-surface-translucent);
      color: var(--color-text);
      box-shadow: var(--shadow-panel);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      transition: background-color 250ms ease, color 250ms ease, border-color 250ms ease, box-shadow 250ms ease;
    }

    .theme-toggle,
    .list-view-toggle {
      position: absolute;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--color-panel-border);
      border-radius: 12px;
      background: var(--color-surface-translucent);
      color: var(--color-text);
      box-shadow: var(--shadow-panel);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
    }

    .theme-toggle {
      top: 20px;
      right: 20px;
      width: 44px;
      padding: 0;
      font-size: 23px;
      line-height: 1;
    }

    .list-view-toggle {
      top: 76px;
      right: 20px;
      gap: 7px;
    }

    .theme-toggle:hover,
    .list-view-toggle:hover {
      background: var(--color-hover);
    }

    .theme-toggle:focus-visible,
    .list-view-toggle:focus-visible {
      outline: 3px solid var(--color-focus-outline);
      outline-offset: 2px;
    }

    .list-view-toggle[aria-expanded="true"] {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: var(--color-primary-text);
    }

    .list-view {
      position: absolute;
      top: 132px;
      right: 20px;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      width: min(320px, calc(100vw - 40px));
      max-height: calc(100vh - 152px);
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid var(--color-panel-border);
      border-radius: 16px;
      background: var(--color-surface-translucent);
      box-shadow: var(--shadow-panel);
      color: var(--color-text);
      transition: background-color 250ms ease, border-color 250ms ease, box-shadow 250ms ease;
    }

    .list-view[hidden] {
      display: none;
    }

    .list-view-heading {
      flex: 0 0 auto;
      margin: 0;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--color-border-soft);
      color: var(--color-text);
      font-size: 15px;
      font-weight: 700;
    }

    .attraction-list {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      overflow-y: auto;
      margin: 0;
      padding: 8px;
      list-style: none;
      scrollbar-width: thin;
      overscroll-behavior: contain;
    }

    .attraction-list-item {
      min-width: 0;
    }

    .attraction-list-button {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 46px;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
    }

    .attraction-list-button:hover,
    .attraction-list-button[aria-current="true"] {
      border-color: var(--color-border-soft);
      background: var(--color-hover);
    }

    .attraction-list-button:focus-visible {
      outline: 3px solid var(--color-focus-outline);
      outline-offset: 1px;
      position: relative;
      z-index: 1;
    }

    .attraction-list-emoji {
      display: flex;
      flex: 0 0 30px;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--color-hover-accent);
      font-size: 18px;
    }

    .attraction-list-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      color: var(--color-text);
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attraction-list-status {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 88px;
      overflow: hidden;
      font-size: 10px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attraction-list-status.is-open {
      color: var(--color-open);
    }

    .attraction-list-status.is-closed {
      color: var(--color-closed);
    }

    .attraction-list-rating {
      flex: 0 0 auto;
      color: var(--color-text-secondary);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .attraction-list-empty {
      margin: 0;
      padding: 14px 12px;
      color: var(--color-text-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .find-me-control {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1002;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      max-width: min(360px, calc(100vw - 40px));
    }

    .find-me-button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--color-panel-border);
      border-radius: 12px;
      background: var(--color-surface-translucent);
      color: var(--color-text);
      box-shadow: var(--shadow-panel);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, opacity 150ms ease, box-shadow 200ms ease;
    }

    .find-me-button:hover:not(:disabled) {
      background: var(--color-hover);
    }

    .find-me-button:focus-visible {
      outline: 3px solid var(--color-focus-outline);
      outline-offset: 2px;
    }

    .find-me-button:disabled {
      cursor: wait;
      opacity: 0.75;
    }

    .location-status {
      max-width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid var(--color-panel-border);
      border-radius: 10px;
      background: var(--color-surface-translucent);
      color: var(--color-text);
      box-shadow: var(--shadow-panel);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 250ms ease, transform 250ms ease, visibility 0s linear 250ms, background-color 250ms ease, color 250ms ease, border-color 250ms ease;
    }

    .location-status.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 0s;
    }

    .search-input {
      display: block;
      width: 100%;
      height: 42px;
      box-sizing: border-box;
      padding: 0 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-input-surface);
      color: var(--color-text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: background-color 250ms ease, color 250ms ease, border-color 200ms ease, box-shadow 200ms ease;
    }

    .search-input::placeholder {
      color: var(--color-placeholder);
    }

    .search-input:focus {
      border-color: var(--color-focus);
      box-shadow: 0 0 0 3px var(--color-focus-shadow);
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 10px;
      padding: 1px 1px 3px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .filter-chip {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--color-border-soft);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-text-secondary);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
    }

    .filter-chip:hover {
      border-color: var(--color-focus-outline);
      background: var(--color-hover-accent);
    }

    .filter-chip.is-active {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: var(--color-primary-text);
    }

    .filter-chip:active {
      transform: scale(0.97);
    }

    .filter-chip:focus-visible,
    .favorite-toggle:focus-visible {
      outline: 3px solid var(--color-focus-outline);
      outline-offset: 2px;
    }

    .attraction-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      font-size: 22px;
    }

    .custom-marker-cluster {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: 48px;
      height: 48px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #1d4ed8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .custom-marker-cluster:hover {
      background: #1e40af;
      transform: scale(1.08);
    }

    .attraction-card {
      position: absolute;
      top: auto;
      bottom: 20px;
      right: 20px;
      z-index: 1003;
      width: 320px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);
      box-sizing: border-box;
      overflow-y: auto;
      padding: 20px;
      border-radius: 16px;
      background: var(--color-surface);
      box-shadow: var(--shadow-card);
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 250ms ease, transform 300ms ease, visibility 250ms ease, background-color 250ms ease, box-shadow 250ms ease;
      pointer-events: none;
    }

    .attraction-card.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-right: 90px;
    }

    .card-emoji {
      display: flex;
      flex: 0 0 44px;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-hover-accent);
      font-size: 25px;
      transition: background-color 250ms ease;
    }

    .card-title-group {
      min-width: 0;
    }

    .card-name {
      margin: 0;
      color: var(--color-text);
      font-size: 17px;
      line-height: 1.3;
      overflow-wrap: anywhere;
      transition: color 250ms ease;
    }

    .card-category {
      display: inline-block;
      margin-top: 4px;
      color: var(--color-text-muted);
      font-size: 12px;
      font-weight: 600;
      transition: color 250ms ease;
    }

    .card-description {
      margin: 0 0 16px;
      padding-left: 10px;
      border-left: 3px solid var(--color-border);
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      transition: color 250ms ease, border-color 250ms ease;
    }

    .card-close,
    .favorite-toggle {
      position: absolute;
      top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      font: inherit;
      line-height: 1;
      transition: background-color 200ms ease, color 200ms ease, transform 200ms ease;
    }

    .card-close {
      right: 14px;
      font-size: 22px;
    }

    .favorite-toggle {
      right: 52px;
      font-size: 19px;
    }

    .card-close:hover,
    .favorite-toggle:hover {
      background: var(--color-hover);
    }

    .favorite-toggle.is-favorite {
      color: var(--color-favorite);
      transform: scale(1.12);
    }

    .card-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--color-text-secondary);
      font-size: 14px;
      transition: color 250ms ease;
    }

    .card-rating {
      color: var(--color-text);
      font-weight: 600;
      white-space: nowrap;
      transition: color 250ms ease;
    }

    .card-status {
      color: var(--color-text-muted);
      text-align: right;
      transition: color 250ms ease;
    }

    .card-status.is-open {
      color: var(--color-open);
    }

    .card-status.is-closed {
      color: var(--color-closed);
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .card-button {
      flex: 1;
      min-width: 0;
      min-height: 42px;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
    }

    .card-button-explore {
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-primary-text);
    }

    .card-button-route {
      border: 1px solid var(--color-accent);
      background: transparent;
      color: var(--color-accent);
    }

    .card-button-explore:hover {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .card-button-route:hover {
      background: var(--color-hover-accent);
    }

    .card-button:active {
      transform: scale(0.98);
    }

    .card-button:focus-visible,
    .card-close:focus-visible {
      outline: 3px solid var(--color-focus-outline);
      outline-offset: 2px;
    }

    @media (min-width: 481px) and (max-width: 800px) {
      .map-panel {
        left: 12px;
        width: calc(100vw - 96px);
        transform: none;
      }

      .weather-widget {
        top: 168px;
        left: 12px;
      }

      .list-view-toggle {
        top: 184px;
        right: 12px;
      }

      .list-view {
        top: 236px;
        right: 12px;
        max-height: calc(100vh - 256px);
      }
    }

    @media (min-width: 801px) and (max-width: 1100px) {
      .weather-widget {
        top: 168px;
        left: 12px;
      }
    }

    @media (min-width: 801px) and (max-width: 950px) {
      .map-panel {
        left: 12px;
        width: min(680px, calc(100vw - 180px));
        transform: none;
      }

      .list-view-toggle {
        top: 184px;
        right: 12px;
      }

      .list-view {
        top: 236px;
        right: 12px;
        max-height: calc(100vh - 256px);
      }
    }

    @media (max-width: 768px) {
      .find-me-control {
        transition: opacity 250ms ease, transform 250ms ease, visibility 0s linear 250ms;
      }

      .weather-widget {
        position: absolute;
        top: 160px;
        left: 12px;
        width: max-content;
        max-width: calc(100vw - 24px);
        margin: 0;
      }

      .attraction-card {
        top: auto;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        max-width: none;
        max-height: calc(100vh - 112px);
        max-height: min(70dvh, calc(100dvh - 112px));
        padding: 20px max(20px, env(safe-area-inset-right, 0px))
          calc(20px + env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
      }

      .attraction-card.is-visible {
        transform: translateY(0);
      }

      body.has-attraction-card .find-me-control {
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px);
        pointer-events: none;
      }

      body:not(.has-attraction-card) .find-me-control {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        pointer-events: auto;
        transition-delay: 0s;
      }

    @media (max-width: 480px) {

        top: 12px;

        height: auto;

      }

      #map {
        height: clamp(280px, 58dvh, 520px);
      }

      .list-view-toggle {

    @media (prefers-reduced-motion: reduce) {
      .map-skeleton,
      .leaflet-tile-pane .leaflet-layer,
      .leaflet-tile,
      .leaflet-marker-icon,
      .map-panel,
      .places-counter,
      .weather-widget,
      .theme-toggle,
      .list-view-toggle,
      .list-view,
      .attraction-list-button,
      .find-me-control,
      .find-me-button,
      .location-status,
      .search-input,
      .filter-chip,
      .attraction-card,
      .card-emoji,
      .card-name,
      .card-category,
      .card-description,
      .card-close,
      .favorite-toggle,
      .card-details,
      .card-rating,
      .card-status,
      .card-button,
      .custom-marker-cluster {
        transition: none !important;
      }

      .filter-chip:active,
      .card-button:active,
      .favorite-toggle.is-favorite,
      .custom-marker-cluster:hover {
        transform: none;
      }
    }
  </style>
</head>

  <script>
    const map = L.map('map').setView([51.169392, 71.449074], 12);

    const mapSkeleton = document.getElementById('map-skeleton');
    window.setTimeout(() => {
      mapSkeleton.classList.add('is-hidden');
      window.setTimeout(() => mapSkeleton.remove(), 100);
    }, 350);

    const LIGHT_TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const DARK_TILE_URL = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';

    function getTileLayerOptions(theme) {
      const attribution = theme === 'dark'
        ? '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        : '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

      return { attribution, subdomains: 'abc', maxZoom: 19 };
    }

    function createTileLayer(theme, opacity = 1) {
      return L.tileLayer(
        theme === 'dark' ? DARK_TILE_URL : LIGHT_TILE_URL,
        { ...getTileLayerOptions(theme), opacity }
      );
    }

    let currentTheme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    let tileLayer = createTileLayer(currentTheme).addTo(map);
    let pendingTileLayer = null;
    let retiringTileLayer = null;
    let tileRemovalTimeout = null;

    function switchTileTheme(theme) {
      if (pendingTileLayer) {
        map.removeLayer(pendingTileLayer);
        pendingTileLayer = null;
      }

      if (tileRemovalTimeout !== null) {
        window.clearTimeout(tileRemovalTimeout);
        tileRemovalTimeout = null;
      }

      if (retiringTileLayer && retiringTileLayer !== tileLayer && map.hasLayer(retiringTileLayer)) {
        map.removeLayer(retiringTileLayer);
      }
      retiringTileLayer = null;

      const previousLayer = tileLayer;
      const nextLayer = createTileLayer(theme, 0);
      pendingTileLayer = nextLayer;

      nextLayer.once('load', () => {
        if (pendingTileLayer !== nextLayer) return;

        pendingTileLayer = null;
        nextLayer.setOpacity(1);
        tileLayer = nextLayer;
        retiringTileLayer = previousLayer;

        const reducedMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const transitionDuration = reducedMotion ? 0 : 400;

        tileRemovalTimeout = window.setTimeout(() => {
          if (retiringTileLayer === previousLayer && map.hasLayer(previousLayer)) {
            map.removeLayer(previousLayer);
            retiringTileLayer = null;
          }
          tileRemovalTimeout = null;
        }, transitionDuration);
      });

      nextLayer.addTo(map);
    }

    const placesCounter = document.getElementById('places-counter');
    const card = document.getElementById('attraction-card');
    const cardEmoji = document.getElementById('card-emoji');
    const cardName = document.getElementById('card-name');
    const cardCategory = document.getElementById('card-category');
    const cardDescription = document.getElementById('card-description');
    const cardRating = document.getElementById('card-rating');
    const cardStatus = document.getElementById('card-status');
    const exploreButton = document.getElementById('explore-button');
    const routeButton = document.getElementById('route-button');
    const closeButton = document.getElementById('close-button');
    const favoriteToggle = document.getElementById('favorite-toggle');
    const themeToggle = document.getElementById('theme-toggle');
    const listViewToggle = document.getElementById('list-view-toggle');
    const listView = document.getElementById('list-view');
    const listViewHeading = document.getElementById('list-view-heading');
    const attractionList = document.getElementById('attraction-list');
    const mapPanel = document.getElementById('map-panel');
    const searchInput = document.getElementById('search-input');
    const filterChips = document.getElementById('filter-chips');
    const findMeControl = document.getElementById('find-me-control');
    const findMeButton = document.getElementById('find-me-button');
    const locationStatus = document.getElementById('location-status');

    let locationStatusTimeout = null;
    let locationRequestInProgress = false;

    function showLocationStatus(message, duration = 7000) {
      locationStatus.textContent = message;
      locationStatus.classList.add('is-visible');

      if (locationStatusTimeout !== null) {
        window.clearTimeout(locationStatusTimeout);
      }

      if (duration > 0) {
        locationStatusTimeout = window.setTimeout(() => {
          locationStatus.classList.remove('is-visible');
          locationStatusTimeout = null;
        }, duration);
      }
    }

    function setLocationRequestState(isPending) {
      locationRequestInProgress = isPending;
      findMeButton.disabled = isPending;
      findMeButton.setAttribute('aria-busy', String(isPending));
      findMeButton.textContent = isPending ? '📍 Finding…' : '📍 Find me';
    }

    function handleLocationError(error) {
      setLocationRequestState(false);

      if (!window.isSecureContext) {
        showLocationStatus('Location access requires a secure context. Open this page over HTTPS or on localhost.');
        return;
      }

      if (!error || typeof error.code !== 'number') {
        showLocationStatus('Could not determine your location. Please try again.');
        return;
      }

      switch (error.code) {
        case error.PERMISSION_DENIED:
          showLocationStatus('Location access was denied or blocked. Allow location access in your browser settings and try again.');
          break;
        case error.POSITION_UNAVAILABLE:
          showLocationStatus('Your location is currently unavailable. Check your device location settings and try again.');
          break;
        case error.TIMEOUT:
          showLocationStatus('The location request timed out. Please try again.');
          break;
        default:
          showLocationStatus('Could not determine your location. Please try again.');
      }
    }

    findMeButton.addEventListener('click', () => {
      if (locationRequestInProgress) return;

      if (!window.isSecureContext) {
        showLocationStatus('Location access requires a secure context. Open this page over HTTPS or on localhost.');
        return;
      }

      if (!navigator.geolocation) {
        showLocationStatus('Location services are not available in this browser.');
        return;
      }

      if (locationStatusTimeout !== null) {
        window.clearTimeout(locationStatusTimeout);
        locationStatusTimeout = null;
      }

      locationStatus.textContent = 'Finding your location…';
      locationStatus.classList.add('is-visible');
      setLocationRequestState(true);

      try {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            setLocationRequestState(false);
            const { latitude, longitude } = position.coords;

            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
              showLocationStatus('Your device returned an invalid location. Please try again.');
              return;
            }

            const targetZoom = Math.max(map.getZoom(), 15);
            map.flyTo([latitude, longitude], targetZoom, {
              animate: true,
              duration: 1.5
            });
            showLocationStatus('Location found.', 3500);
          },
          handleLocationError,
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
      } catch (error) {
        handleLocationError(error);
      }
    });

    function updateThemeToggle() {
      const isDark = currentTheme === 'dark';
      themeToggle.textContent = isDark ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.setAttribute(
        'aria-label',
        isDark ? 'Включить светлую тему' : 'Включить тёмную тему'
      );
      themeToggle.title = isDark ? 'Включить светлую тему' : 'Включить тёмную тему';
    }

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = currentTheme;
      switchTileTheme(currentTheme);

      try {
        window.localStorage.setItem('astana-explorer-theme', currentTheme);
      } catch (error) {
        // Тема остаётся включённой до завершения текущей сессии.
      }

      updateThemeToggle();
    });

    listViewToggle.addEventListener('click', () => {
      const shouldExpand = listViewToggle.getAttribute('aria-expanded') !== 'true';

      if (shouldExpand) {
        renderAttractionList(getFilteredAttractions());
        updateListAttractionStatuses();
      }

      listViewToggle.setAttribute('aria-expanded', String(shouldExpand));
      listView.hidden = !shouldExpand;
    });

    updateThemeToggle();

    L.DomEvent.disableClickPropagation(card);
    L.DomEvent.disableScrollPropagation(card);
    L.DomEvent.disableClickPropagation(mapPanel);
    L.DomEvent.disableScrollPropagation(mapPanel);
    L.DomEvent.disableClickPropagation(findMeControl);
    L.DomEvent.disableClickPropagation(themeToggle);
    L.DomEvent.disableClickPropagation(listViewToggle);
    L.DomEvent.disableClickPropagation(listView);
    L.DomEvent.disableScrollPropagation(listView);

    mapPanel.addEventListener('keydown', (event) => event.stopPropagation());
    findMeControl.addEventListener('keydown', (event) => event.stopPropagation());
    card.addEventListener('keydown', (event) => event.stopPropagation());
    themeToggle.addEventListener('keydown', (event) => event.stopPropagation());

    listViewToggle.addEventListener('keydown', (event) => {
      event.stopPropagation();

      if (listView.hidden || !['ArrowDown', 'ArrowUp'].includes(event.key)) return;

      const buttons = attractionList.querySelectorAll('.attraction-list-button');
      if (!buttons.length) return;

      event.preventDefault();
      (event.key === 'ArrowDown' ? buttons[0] : buttons[buttons.length - 1]).focus();
    });

    listView.addEventListener('keydown', (event) => {
      event.stopPropagation();

      if (event.key === 'Escape') {
        listView.hidden = true;
        listViewToggle.setAttribute('aria-expanded', 'false');
        listViewToggle.focus();
        return;
      }

      const button = event.target.closest('.attraction-list-button');
      if (!button) return;

      const buttons = [...attractionList.querySelectorAll('.attraction-list-button')];
      const currentIndex = buttons.indexOf(button);
      if (currentIndex < 0 || !buttons.length) return;

      let nextIndex = currentIndex;

      switch (event.key) {
        case 'ArrowDown':
          nextIndex = (currentIndex + 1) % buttons.length;
          break;
        case 'ArrowUp':
          nextIndex = (currentIndex - 1 + buttons.length) % buttons.length;
          break;
        case 'Home':
          nextIndex = 0;
          break;
        case 'End':
          nextIndex = buttons.length - 1;
          break;
        default:
          return;
      }

      event.preventDefault();
      buttons[nextIndex].focus();
    });

    const attractionMarkers = L.markerClusterGroup({
      maxClusterRadius: 50,
      zoomToBoundsOnClick: true,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      iconCreateFunction(cluster) {
        const count = cluster.getChildCount();

        return L.divIcon({
          html: `<span>${count}</span>`,
          className: 'custom-marker-cluster',
          iconSize: L.point(48, 48)
        });
      }
    }).addTo(map);

    const markersById = new Map();
    const visibleMarkerIds = new Set(attractions.map((attraction) => attraction.id));

    let selectedAttraction = null;
    let selectedMarker = null;
    let activeFilter = 'all';
    let searchQuery = '';
    let filterRevision = 0;
    let listSelectionRevision = 0;

    const FAVORITES_STORAGE_KEY = 'astana-explorer-favorites';
    const attractionIds = new Set(attractions.map((attraction) => attraction.id));
    let favoriteIds = new Set();

    try {
      const savedFavorites = JSON.parse(
        window.localStorage.getItem(FAVORITES_STORAGE_KEY) || '[]'
      );

      if (Array.isArray(savedFavorites)) {
        favoriteIds = new Set(
          savedFavorites.filter((id) => typeof id === 'string' && attractionIds.has(id))
        );
      }
    } catch (error) {
      favoriteIds = new Set();
    }

    function saveFavorites() {
      try {
        window.localStorage.setItem(
          FAVORITES_STORAGE_KEY,
          JSON.stringify([...favoriteIds])
        );
      } catch (error) {
        // Избранное продолжает работать в памяти до завершения текущей сессии.
      }
    }

    function getAttractionStatus(attraction, now = new Date()) {
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const openMinutes = attraction.openHour * 60;
      const closeMinutes = attraction.closeHour * 60;

      const isOpen = openMinutes < closeMinutes
        ? currentMinutes >= openMinutes && currentMinutes < closeMinutes
        : openMinutes > closeMinutes
          ? currentMinutes >= openMinutes || currentMinutes < closeMinutes
          : true;

      const statusText = isOpen
        ? `Open until ${String(attraction.closeHour).padStart(2, '0')}:00`
        : `Closed · Opens at ${String(attraction.openHour).padStart(2, '0')}:00`;

      return { isOpen, statusText };
    }

    function updateAttractionStatus(attraction) {
      const status = getAttractionStatus(attraction);
      cardStatus.textContent = status.statusText;
      cardStatus.classList.toggle('is-open', status.isOpen);
      cardStatus.classList.toggle('is-closed', !status.isOpen);
    }

    function updateListAttractionStatuses() {
      attractionList.querySelectorAll('[data-attraction-status-id]').forEach((statusElement) => {
        const attraction = attractions.find(
          (item) => item.id === statusElement.dataset.attractionStatusId
        );
        if (!attraction) return;

        const status = getAttractionStatus(attraction);
        statusElement.textContent = status.statusText;
        statusElement.classList.toggle('is-open', status.isOpen);
        statusElement.classList.toggle('is-closed', !status.isOpen);
      });
    }

    function updateSelectedAttractionStatus() {
      if (selectedAttraction) updateAttractionStatus(selectedAttraction);
      updateListAttractionStatuses();
    }

    function getFilteredAttractions() {
      return attractions.filter((attraction) => {
        const matchesCategory = activeFilter === 'all'
          || (activeFilter === 'favorites'
            ? favoriteIds.has(attraction.id)
            : attraction.category === activeFilter);
        const matchesSearch = attraction.name.toLocaleLowerCase().includes(searchQuery);

        return matchesCategory && matchesSearch;
      });
    }

    function renderAttractionList(filteredAttractions) {
      attractionList.replaceChildren();
      listViewHeading.textContent = `Places (${filteredAttractions.length})`;

      if (filteredAttractions.length === 0) {
        const listItem = document.createElement('li');
        listItem.className = 'attraction-list-item';

        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'attraction-list-empty';
        emptyMessage.textContent = 'No places match your search or filters.';

        listItem.appendChild(emptyMessage);
        attractionList.appendChild(listItem);
        return;
      }

      const sortedAttractions = [...filteredAttractions].sort(
        (first, second) => second.rating - first.rating
          || first.name.localeCompare(second.name)
      );

      sortedAttractions.forEach((attraction) => {
        const listItem = document.createElement('li');
        const button = document.createElement('button');
        const emoji = document.createElement('span');
        const name = document.createElement('span');
        const status = document.createElement('span');
        const rating = document.createElement('span');
        const attractionStatus = getAttractionStatus(attraction);

        listItem.className = 'attraction-list-item';
        button.className = 'attraction-list-button';
        button.type = 'button';
        button.setAttribute('aria-current', String(
          Boolean(selectedAttraction && selectedAttraction.id === attraction.id)
        ));

        emoji.className = 'attraction-list-emoji';
        emoji.setAttribute('aria-hidden', 'true');
        emoji.textContent = attraction.emoji;

        name.className = 'attraction-list-name';
        name.textContent = attraction.name;

        status.className = `attraction-list-status ${attractionStatus.isOpen ? 'is-open' : 'is-closed'}`;
        status.dataset.attractionStatusId = attraction.id;
        status.textContent = attractionStatus.statusText;

        rating.className = 'attraction-list-rating';
        rating.textContent = `⭐ ${attraction.rating.toFixed(1)}`;

        button.append(emoji, name, rating, status);
        listItem.appendChild(button);

        button.addEventListener('click', () => {
          const requestRevision = ++listSelectionRevision;
          const expectedFilterRevision = filterRevision;

          const isStillFiltered = getFilteredAttractions().some(
            (item) => item.id === attraction.id
          );
          if (!isStillFiltered) return;

          const marker = markersById.get(attraction.id);
          if (!marker || !attractionMarkers.hasLayer(marker)) return;

          attractionMarkers.zoomToShowLayer(marker, () => {
            if (
              requestRevision !== listSelectionRevision
              || expectedFilterRevision !== filterRevision
              || !attractionMarkers.hasLayer(marker)
            ) {
              return;
            }

            const isStillFilteredAfterZoom = getFilteredAttractions().some(
              (item) => item.id === attraction.id
            );
            if (!isStillFilteredAfterZoom) return;

            map.flyTo(attraction.coordinates, Math.max(map.getZoom(), 15));
            showAttraction(attraction, marker);
          });
        });

        attractionList.appendChild(listItem);
      });
    }

    function filterMarkers() {
      filterRevision += 1;
      listSelectionRevision += 1;

      const filteredAttractions = getFilteredAttractions();
      const filteredAttractionIds = new Set(
        filteredAttractions.map((attraction) => attraction.id)
      );

      placesCounter.textContent = `Showing ${filteredAttractions.length} of ${attractions.length} places`;
      renderAttractionList(filteredAttractions);

      attractions.forEach((attraction) => {
        const marker = markersById.get(attraction.id);
        if (!marker) return;

        const shouldShow = filteredAttractionIds.has(attraction.id);
        const isOnMap = attractionMarkers.hasLayer(marker);

        if (shouldShow) {
          visibleMarkerIds.add(attraction.id);
          if (!isOnMap) attractionMarkers.addLayer(marker);
        } else {
          visibleMarkerIds.delete(attraction.id);
          if (isOnMap) attractionMarkers.removeLayer(marker);
        }
      });

      if (selectedAttraction && !visibleMarkerIds.has(selectedAttraction.id)) {
        hideAttraction();
      }
    }

    function showAttraction(attraction, marker) {
      listSelectionRevision += 1;
      selectedAttraction = attraction;
      selectedMarker = marker;

      const category = categories[attraction.category];
      const isFavorite = favoriteIds.has(attraction.id);

      cardEmoji.textContent = attraction.emoji;
      cardName.textContent = attraction.name;
      cardCategory.textContent = category.label;
      cardCategory.style.color = category.color;
      cardDescription.textContent = attraction.description;
      cardDescription.style.borderLeftColor = category.color;
      cardRating.textContent = `⭐ ${attraction.rating.toFixed(1)}`;
      updateAttractionStatus(attraction);
      favoriteToggle.classList.toggle('is-favorite', isFavorite);
      favoriteToggle.textContent = isFavorite ? '♥' : '♡';
      favoriteToggle.setAttribute('aria-pressed', String(isFavorite));
      favoriteToggle.setAttribute(
        'aria-label',
        isFavorite ? 'Убрать из избранного' : 'Добавить в избранное'
      );
      card.setAttribute('aria-hidden', 'false');
      card.classList.add('is-visible');
      document.body.classList.add('has-attraction-card');
      renderAttractionList(getFilteredAttractions());
    }

    function hideAttraction() {
      listSelectionRevision += 1;
      card.classList.remove('is-visible');
      card.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('has-attraction-card');
      selectedAttraction = null;
      selectedMarker = null;
      renderAttractionList(getFilteredAttractions());
    }

    attractions.forEach((attraction) => {
      const icon = L.divIcon({
        html: attraction.emoji,
        className: `attraction-icon attraction-icon-${attraction.category}`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      const marker = L.marker(attraction.coordinates, {
        icon,
        title: attraction.name,
        alt: attraction.name,
        keyboard: true
      });

      markersById.set(attraction.id, marker);
      attractionMarkers.addLayer(marker);
      marker.on('click', () => showAttraction(attraction, marker));
    });

    filterMarkers();

    filterChips.addEventListener('click', (event) => {
      const chip = event.target.closest('[data-filter]');
      if (!chip) return;

      activeFilter = chip.dataset.filter;
      filterChips.querySelectorAll('[data-filter]').forEach((filterChip) => {
        const isActive = filterChip === chip;
        filterChip.classList.toggle('is-active', isActive);
        filterChip.setAttribute('aria-pressed', String(isActive));
      });

      filterMarkers();
    });

    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.trim().toLocaleLowerCase();
      filterMarkers();
    });

    favoriteToggle.addEventListener('click', () => {
      if (!selectedAttraction) return;

      const attractionId = selectedAttraction.id;
      if (favoriteIds.has(attractionId)) {
        favoriteIds.delete(attractionId);
      } else {
        favoriteIds.add(attractionId);
      }

      saveFavorites();
      showAttraction(selectedAttraction, selectedMarker);
      filterMarkers();
    });

    map.on('click', hideAttraction);
    closeButton.addEventListener('click', hideAttraction);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && card.classList.contains('is-visible')) {
        hideAttraction();
      }
    }, true);

    exploreButton.addEventListener('click', () => {
      if (!selectedAttraction || !selectedMarker) return;
      map.flyTo(selectedAttraction.coordinates, 16);
    });

    routeButton.addEventListener('click', () => {
      if (!selectedAttraction) return;

      const [latitude, longitude] = selectedAttraction.coordinates;
      const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${latitude},${longitude}`;
      window.open(routeUrl, '_blank', 'noopener,noreferrer');
    });

    window.setInterval(updateSelectedAttractionStatus, 60000);

    let mapResizeFrame = null;

    function invalidateMapSize() {
      if (mapResizeFrame !== null) return;

      mapResizeFrame = window.requestAnimationFrame(() => {
        mapResizeFrame = null;
        map.invalidateSize({ pan: false });
      });
    }

    if ('ResizeObserver' in window) {
      const mapResizeObserver = new ResizeObserver(invalidateMapSize);
      mapResizeObserver.observe(document.getElementById('map'));
    }

    window.addEventListener('resize', invalidateMapSize);
    window.addEventListener('orientationchange', invalidateMapSize);
  </script>
</body>
</html>
